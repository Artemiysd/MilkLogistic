name: milklogistic

# Порты и адреса можно переопределить в .env (см. .env.example)
services:

  db:
    image: postgres:16-alpine
    container_name: milk-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-milk}
      POSTGRES_USER: ${POSTGRES_USER:-milk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-milk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milk} -d ${POSTGRES_DB:-milk}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [milk]

  # Слой OSRM: координаты -> дорожные расстояния, время, геометрия.
  # Его зовёт бэкенд/алгоритм, наружу торчит порт 8100.
  routing:
    build:
      context: ./services/routing
    container_name: milk-routing
    environment:
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      OSRM_TIMEOUT_SEC: "30"
      OSRM_MIN_INTERVAL_SEC: "${OSRM_MIN_INTERVAL_SEC:-0.4}"
      MAX_POINTS: "300"
    ports:
      - "${ROUTING_PORT:-8100}:8100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/api/health', timeout=20).status==200 else 1)"
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks: [milk]

  # Пока бэкенда нет — поднимается заглушка по контракту schema.json.
  # Когда появится backend/, запускайте с наложением:
  #   docker compose -f docker-compose.yml -f docker-compose.backend.yml up -d --build
  api:
    build:
      context: ./infra/mock-api
    container_name: milk-api
    environment:
      DATA_FILE: /data/logistics_data.json
      PORT: "8000"
      ROUTING_URL: ${ROUTING_URL:-http://routing:8100}
    volumes:
      - ./data:/data:ro
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks: [milk]

  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    container_name: milk-web
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-api:8000}
    ports:
      - "${WEB_PORT:-8080}:80"
    # без depends_on: иначе `docker compose up -d web` пересоздаёт api
    # по базовому файлу (заглушка, read-only /data). nginx дождётся api сам.
    restart: unless-stopped
    networks: [milk]

  # Разовые инструменты: сборка матрицы расстояний без Python на хосте.
  #   docker compose run --rm matrix
  #   docker compose run --rm matrix --verify
  matrix:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/matrix/Dockerfile
    volumes:
      - ./data:/app/data
    networks: [milk]

  # Свой OSRM. Нужен только если публичный demo-сервер недоступен.
  # Перед запуском: infra/osrm/prepare.ps1 (готовит данные в infra/osrm/data).
  osrm:
    profiles: ["geo"]
    image: osrm/osrm-backend:v5.25.0
    container_name: milk-osrm
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/grodno.osrm
    volumes:
      - ./infra/osrm/data:/data:ro
    ports:
      - "${OSRM_PORT:-5000}:5000"
    restart: unless-stopped
    networks: [milk]

volumes:
  pgdata:

networks:
  milk:
    driver: bridge
