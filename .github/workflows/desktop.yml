name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: electron:build
          - os: macos-latest
            script: electron:build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MilkLogistic/package-lock.json

      - name: Install dependencies
        working-directory: MilkLogistic
        run: npm ci

      - name: Build desktop app
        working-directory: MilkLogistic
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MilkLogistic-${{ matrix.os }}
          if-no-files-found: error
          path: |
            MilkLogistic/release/*.exe
            MilkLogistic/release/*.dmg
            MilkLogistic/release/*.zip
