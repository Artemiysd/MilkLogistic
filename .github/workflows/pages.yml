name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MilkLogistic/package-lock.json

      - name: Install dependencies
        working-directory: MilkLogistic
        run: npm ci

      - name: Build frontend for /MilkLogistic/
        working-directory: MilkLogistic
        env:
          VITE_BASE: /MilkLogistic/
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build

      - name: SPA fallback for GitHub Pages
        run: cp MilkLogistic/dist/index.html MilkLogistic/dist/404.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./MilkLogistic/dist
          publish_branch: gh-pages
          enable_jekyll: false
