# Наложение поверх docker-compose.yml: заменяет заглушку на реальный бэкенд
# (обёртка над планировщиком logistics/ + матрица OSRM).
#   docker compose -f docker-compose.yml -f docker-compose.backend.yml up -d --build
services:
  api:
    # своё имя образа: иначе базовый compose (заглушка) и бэкенд делят один тег
    image: milklogistic-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATA_FILE: /data/logistics_data.json
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-milk}:${POSTGRES_PASSWORD:-milk}@db:5432/${POSTGRES_DB:-milk}
      ROUTING_URL: ${ROUTING_URL:-http://routing:8100}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      MATRIX_CACHE: /data/matrix_cache.json
      RUNS_DIR: /data/runs
      IMPORT_DIR: /data/imports
      DB_PATH: /data/milk.db
      PLANNER_ROOT: /app
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      routing:
        condition: service_started
